name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 4. Install required Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 5. Find ZIP file
      # --------------------------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for project ZIP..."

          ZIP_FILE=""

          while IFS= read -r file; do
            if [[ "$file" != *"/.git/"* ]]; then
              ZIP_FILE="$file"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -not -path "*/.gradle/*" \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -print || true
            exit 1
          fi

          echo "ZIP file found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo ""
          echo "ZIP extraction completed."

          echo ""
          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 5 \
            -type f \
            | head -200

      # --------------------------------------------------
      # 7. Find Android Gradle project
      # --------------------------------------------------
      - name: Find Android Gradle Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          # First priority:
          # settings.gradle.kts
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/build.gradle.kts" ] || \
               [ -f "$candidate/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name "settings.gradle.kts" \
              -not -path "*/.gradle/*" \
              -print
          )

          # Second priority:
          # settings.gradle
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r settings_file; do
              candidate="$(dirname "$settings_file")"

              if [ -f "$candidate/build.gradle.kts" ] || \
                 [ -f "$candidate/build.gradle" ]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE/extracted" \
                -type f \
                -name "settings.gradle" \
                -not -path "*/.gradle/*" \
                -print
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Repository structure:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 \
              -type f \
              -print | head -300
            exit 1
          fi

          echo ""
          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. Verify Android project
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Android project..."
          echo ""

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && \
             [ ! -f "build.gradle" ]; then
            echo "ERROR: Root build.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

          echo ""
          echo "Android project structure verified successfully."

      # --------------------------------------------------
      # 9. Setup Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # --------------------------------------------------
      # 10. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Preparing Gradle..."

          if [ -f "gradlew" ]; then
            echo "Gradle wrapper found."

            chmod +x gradlew

            echo "Using Gradle wrapper:"
            ./gradlew --version

          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 8.11.1."

            gradle --version
          fi

      # --------------------------------------------------
      # 11. Create debug keystore
      # --------------------------------------------------
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "Debug keystore created."

          else

            echo "Debug keystore already exists."

          fi

      # --------------------------------------------------
      # 12. Clean project
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Cleaning project..."

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      # --------------------------------------------------
      # 13. Build Debug APK
      # --------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Debug APK..."
          echo "Project directory:"
          pwd

          if [ -f "gradlew" ]; then

            chmod +x gradlew

            ./gradlew \
              :app:assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle \
              :app:assembleDebug \
              --no-daemon \
              --stacktrace

          fi

      # --------------------------------------------------
      # 14. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_FILE=""

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            | head -1)

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK was not found."
            echo ""
            echo "APK output directory:"
            find "$PROJECT_DIR/app/build" \
              -type f \
              -print | head -200 || true
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 15. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK file does not exist."
            exit 1
          fi

          echo "APK verification successful."

          echo ""
          echo "APK details:"
          ls -lh "$APK_FILE"

          echo ""
          file "$APK_FILE"

      # --------------------------------------------------
      # 16. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ env.APK_FILE }}
