name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Find ZIP
      # --------------------------------------------------
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 4. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Extraction completed."

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" -maxdepth 3 -type f \
            | head -100

      # --------------------------------------------------
      # 5. Find Android Project AFTER extraction
      # --------------------------------------------------
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # First preference: settings.gradle / settings.gradle.kts
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          # Second preference: gradlew
          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name "gradlew" \
              -not -path "*/.gradle/*" \
              | head -n 1)

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            fi
          fi

          # Third preference: build.gradle(.kts)
          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Project structure:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f \
              | sort | head -300
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. Verify project structure
      # --------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo
          echo "Project files:"
          find . -maxdepth 3 -type f \
            | sort \
            | head -300

          echo
          echo "Gradle files:"
          find . -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            | sort

      # --------------------------------------------------
      # 7. Check Google Services
      # --------------------------------------------------
      - name: Check Google Services
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          GOOGLE_FILE=$(find . \
            -type f \
            -name "google-services.json" \
            | head -n 1 || true)

          if [ -n "$GOOGLE_FILE" ]; then
            echo "google-services.json found:"
            echo "$GOOGLE_FILE"
          else
            echo "WARNING: google-services.json was not found."

            echo
            echo "If this app uses Firebase/Google Services,"
            echo "you MUST add the correct google-services.json"
            echo "to the Android app module."
          fi

      # --------------------------------------------------
      # 8. Setup Gradle 9.3.1
      # --------------------------------------------------
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # --------------------------------------------------
      # 9. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          # Use wrapper if available
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
            ./gradlew --version
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 9.3.1."
          fi

      # --------------------------------------------------
      # 10. Create debug keystore
      # --------------------------------------------------
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.android"

          if [ ! -f "$KEYSTORE" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "Debug keystore created."
          else
            echo "Debug keystore already exists."
          fi

      # --------------------------------------------------
      # 11. Clean project
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean --no-daemon --stacktrace
          else
            gradle clean --no-daemon --stacktrace
          fi

      # --------------------------------------------------
      # 12. Build Debug APK
      # --------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo
          echo "========================================"
          echo "Building Debug APK"
          echo "========================================"
          echo

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              assembleDebug \
              --no-daemon \
              --stacktrace \
              --info
          else
            gradle \
              assembleDebug \
              --no-daemon \
              --stacktrace \
              --info
          fi

      # --------------------------------------------------
      # 13. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."

            echo
            echo "APK search results:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 14. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK file does not exist."
            exit 1
          fi

          echo "APK verification successful."

          ls -lh "$APK_FILE"

          echo
          echo "APK SHA256:"
          sha256sum "$APK_FILE"

      # --------------------------------------------------
      # 15. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-debug-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 16. Build Summary
      # --------------------------------------------------
      - name: Build Summary
        shell: bash
        run: |
          echo "## ✅ HILIM CHILIM APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**APK:** HILIM-CHILIM-debug-APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK is available in the workflow Artifacts." >> "$GITHUB_STEP_SUMMARY"
