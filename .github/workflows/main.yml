name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT SOURCE CODE
      # ==================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==================================================
      # 2. SETUP JAVA 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. EXTRACT ZIP
      # ==================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking repository for ZIP file..."
          echo "======================================"

          ZIP_FILE=""

          # First check the expected ZIP name
          if [ -f "zip.zip" ]; then
            ZIP_FILE="zip.zip"
          fi

          # If not found, search for any ZIP
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . \
              -maxdepth 4 \
              -type f \
              -iname "*.zip" \
              -print \
              -quit || true)
          fi

          # Stop if ZIP does not exist
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file was not found."

            echo ""
            echo "Files available in repository:"
            find . -maxdepth 5 -type f -print | head -300

            exit 1
          fi

          echo "ZIP file found:"
          echo "$ZIP_FILE"

          # Clean previous extraction
          rm -rf extracted

          mkdir -p extracted

          # Extract ZIP
          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "ZIP extraction completed successfully."

          echo ""
          echo "Extracted structure:"
          find extracted -maxdepth 5 -type f -print | head -300


      # ==================================================
      # 4. FIND ANDROID GRADLE PROJECT
      # ==================================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android Gradle project..."
          echo "======================================"

          PROJECT_DIR=""

          # ------------------------------------------------
          # Check extracted root
          # ------------------------------------------------
          if [ -f "extracted/settings.gradle" ] || \
             [ -f "extracted/settings.gradle.kts" ]; then

            if [ -f "extracted/build.gradle" ] || \
               [ -f "extracted/build.gradle.kts" ]; then

              PROJECT_DIR="extracted"

            fi
          fi


          # ------------------------------------------------
          # Search nested project directories
          # ------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            while IFS= read -r SETTINGS_FILE; do

              CANDIDATE_DIR="$(dirname "$SETTINGS_FILE")"

              if [ -f "$CANDIDATE_DIR/build.gradle" ] || \
                 [ -f "$CANDIDATE_DIR/build.gradle.kts" ]; then

                PROJECT_DIR="$CANDIDATE_DIR"
                break

              fi

            done < <(
              find extracted \
                -type f \
                \( \
                  -name "settings.gradle" \
                  -o \
                  -name "settings.gradle.kts" \
                \) \
                -not -path "*/.gradle/*" \
                -print
            )

          fi


          # ------------------------------------------------
          # Final fallback
          # ------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android Gradle project was not found."

            echo ""
            echo "Repository structure:"
            find . -maxdepth 6 -type f -print | head -500

            exit 1

          fi


          # Convert to absolute path
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo ""
          echo "======================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

          # Save for following steps
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 5. VERIFY PROJECT STRUCTURE
      # ==================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Verifying Android project..."
          echo "======================================"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Checking settings.gradle..."

          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
          elif [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Found settings.gradle"
          else
            echo "ERROR: settings.gradle not found."
            exit 1
          fi


          echo ""
          echo "Checking build.gradle..."

          if [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "Found build.gradle.kts"
          elif [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "Found build.gradle"
          else
            echo "ERROR: build.gradle not found."
            exit 1
          fi


          echo ""
          echo "Checking Android app module..."

          if [ -d "$PROJECT_DIR/app" ]; then
            echo "app directory found."
          else
            echo "WARNING: app directory not found at root."
            echo "Searching for Android modules..."

            find "$PROJECT_DIR" \
              -maxdepth 3 \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              -print
          fi


          echo ""
          echo "Project structure verified."


      # ==================================================
      # 6. SETUP GRADLE 9.3.1
      # ==================================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      # ==================================================
      # 7. PREPARE GRADLE
      # ==================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Preparing Gradle..."
          echo "======================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Gradle version:"
          gradle --version


          # ------------------------------------------------
          # If wrapper exists, make it executable
          # ------------------------------------------------
          if [ -f "gradlew" ]; then

            echo ""
            echo "Gradle wrapper found."

            chmod +x gradlew

          else

            echo ""
            echo "Gradle wrapper not found."
            echo "Creating Gradle wrapper 9.3.1..."

            gradle wrapper \
              --gradle-version 9.3.1

            chmod +x gradlew

            echo ""
            echo "Gradle wrapper created successfully."

          fi


          echo ""
          echo "Gradle preparation completed."


      # ==================================================
      # 8. CREATE DEBUG KEYSTORE
      # ==================================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Preparing debug keystore..."
          echo "======================================"

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "Debug keystore created."

          else

            echo "Debug keystore already exists."

          fi


      # ==================================================
      # 9. CLEAN PROJECT
      # ==================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Cleaning project..."
          echo "======================================"

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==================================================
      # 10. BUILD DEBUG APK
      # ==================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Debug APK..."
          echo "======================================"

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ==================================================
      # 11. FIND APK
      # ==================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for generated APK..."
          echo "======================================"

          APK_FILE=""

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print \
            -quit || true)


          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching all APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            echo ""
            echo "Searching build output directories:"
            find "$PROJECT_DIR" \
              -type d \
              -path "*/build/outputs*" \
              -print || true

            exit 1

          fi


          echo ""
          echo "APK found:"
          echo "$APK_FILE"


          # Copy APK to repository workspace
          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/HILIM-CHILIM-debug.apk"


          echo "APK_PATH=$GITHUB_WORKSPACE/HILIM-CHILIM-debug.apk" \
            >> "$GITHUB_ENV"


      # ==================================================
      # 12. VERIFY APK
      # ==================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Verifying APK..."
          echo "======================================"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file does not exist."
            exit 1
          fi

          echo ""
          echo "APK successfully generated."

          ls -lh "$APK_PATH"

          echo ""
          file "$APK_PATH"


      # ==================================================
      # 13. UPLOAD APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: HILIM-CHILIM-debug.apk
          if-no-files-found: error


      # ==================================================
      # 14. BUILD SUMMARY
      # ==================================================
      - name: Build Summary
        shell: bash
        run: |
          echo "## HILIM CHILIM APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ APK build completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 APK: HILIM-CHILIM-debug.apk" >> "$GITHUB_STEP_SUMMARY"
