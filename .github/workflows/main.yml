name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Source Code
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Verify Java 17
      # ==========================================
      - name: Verify Java 17
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Java 17 Verification"
          echo "======================================"

          echo ""
          echo "Java version:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Java compiler:"
          javac -version

          echo ""
          echo "Java 17 setup completed successfully."


      # ==========================================
      # 4. Setup Gradle 9.3.1
      # ==========================================
      - name: Setup Gradle 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.3.1"

          echo "======================================"
          echo "Installing Gradle ${GRADLE_VERSION}"
          echo "======================================"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O /tmp/gradle.zip

          sudo mkdir -p /opt/gradle

          sudo unzip -q \
            /tmp/gradle.zip \
            -d /opt/gradle

          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          export PATH="/opt/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"

          echo ""
          echo "Gradle version:"
          gradle --version


      # ==========================================
      # 5. Find ZIP File
      # ==========================================
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for ZIP file"
          echo "======================================"

          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: ZIP file was not found."
            exit 1
          fi

          echo ""
          echo "ZIP file found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Extract ZIP
      # ==========================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Extracting ZIP"
          echo "======================================"

          rm -rf extracted

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | sort | head -300


      # ==========================================
      # 7. Find Android Project
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Finding Android Project"
          echo "======================================"

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then

            BUILD_FILE=$(find extracted -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android project was not found."
            echo ""
            echo "Searching extracted directory:"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 8. Verify Project Structure
      # ==========================================
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Project Structure"
          echo "======================================"

          echo ""
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -300

          echo ""

          if [ -f "settings.gradle" ]; then
            echo "settings.gradle: FOUND"
          elif [ -f "settings.gradle.kts" ]; then
            echo "settings.gradle.kts: FOUND"
          else
            echo "WARNING: settings.gradle not found."
          fi

          if [ -f "build.gradle" ]; then
            echo "build.gradle: FOUND"
          elif [ -f "build.gradle.kts" ]; then
            echo "build.gradle.kts: FOUND"
          else
            echo "ERROR: build.gradle not found."
            exit 1
          fi


      # ==========================================
      # 9. Create Gradle Wrapper
      # ==========================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Preparing Gradle Wrapper"
          echo "======================================"

          gradle wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper created."

          echo ""
          echo "Gradle version:"
          ./gradlew --version


      # ==========================================
      # 10. Clean Project
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Cleaning Project"
          echo "======================================"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 11. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Debug APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ==========================================
      # 12. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for APK"
          echo "======================================"

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -E "/build/outputs/apk/debug/.*\.apk$" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: Debug APK was not found."

            echo ""
            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" || true

            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/HILIM-CHILIM-debug.apk"

          echo "APK_FILE=$GITHUB_WORKSPACE/HILIM-CHILIM-debug.apk" >> "$GITHUB_ENV"


      # ==========================================
      # 13. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Verifying APK"
          echo "======================================"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK does not exist."
            exit 1
          fi

          echo ""
          echo "APK successfully created."

          echo ""
          echo "APK information:"
          ls -lh "$APK_FILE"

          file "$APK_FILE"


      # ==========================================
      # 14. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error


      # ==========================================
      # 15. Build Summary
      # ==========================================
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       HILIM CHILIM APK BUILD"
          echo "======================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Project:"
          echo "${PROJECT_DIR:-Not found}"

          echo ""
          echo "APK:"
          if [ -f "$GITHUB_WORKSPACE/HILIM-CHILIM-debug.apk" ]; then
            ls -lh "$GITHUB_WORKSPACE/HILIM-CHILIM-debug.apk"
          else
            echo "APK was not generated."
          fi

          echo ""
          echo "======================================"
