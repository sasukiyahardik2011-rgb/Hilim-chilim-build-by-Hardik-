name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extraction completed."

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 4 \
            -type f \
            | head -200

      # --------------------------------------------------
      # 4. Find Android Gradle Project
      # --------------------------------------------------
      - name: Find Android Project
        id: find_project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          # First search for settings.gradle / settings.gradle.kts
          while IFS= read -r SETTINGS_FILE; do

            DIR=$(dirname "$SETTINGS_FILE")

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              if [ -f "$DIR/build.gradle" ] || \
                 [ -f "$DIR/build.gradle.kts" ] || \
                 [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then

                PROJECT_DIR="$DIR"
                break

              fi
            fi

          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*"
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Repository structure:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              -not -path "*/.git/*" \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo ""
          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Show Project Structure
      # --------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          cd "$PROJECT_DIR"

          echo ""
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f \
            | sort \
            | head -300

          echo ""
          echo "Gradle files:"

          if [ -f "settings.gradle.kts" ]; then
            echo "settings.gradle.kts found"
          fi

          if [ -f "settings.gradle" ]; then
            echo "settings.gradle found"
          fi

          if [ -f "build.gradle.kts" ]; then
            echo "build.gradle.kts found"
          fi

          if [ -f "build.gradle" ]; then
            echo "build.gradle found"
          fi

          if [ -f "app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts found"
          fi

          if [ -f "app/build.gradle" ]; then
            echo "app/build.gradle found"
          fi

      # --------------------------------------------------
      # 6. Setup Gradle 9.3.1
      # --------------------------------------------------
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # --------------------------------------------------
      # 7. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Preparing Gradle..."

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Gradle wrapper found."
            ./gradlew --version
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 9.3.1."
            gradle --version
          fi

      # --------------------------------------------------
      # 8. Create Debug Keystore
      # --------------------------------------------------
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "Debug keystore created."

          else
            echo "Debug keystore already exists."
          fi

      # --------------------------------------------------
      # 9. Clean Project
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Cleaning project..."

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      # --------------------------------------------------
      # 10. Build Debug APK
      # --------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Debug APK..."

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # --------------------------------------------------
      # 11. Find APK
      # --------------------------------------------------
      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching build outputs:"
            find "$PROJECT_DIR" \
              -type f \
              | grep -E "(apk|aab)$" \
              | head -100 || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/HILIM-CHILIM-debug.apk"

          echo "APK_PATH=$GITHUB_WORKSPACE/apk-output/HILIM-CHILIM-debug.apk" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 12. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found."
            exit 1
          fi

          echo "APK verification successful."

          ls -lh "$APK_PATH"

          file "$APK_PATH"

      # --------------------------------------------------
      # 13. Upload APK Artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: apk-output/HILIM-CHILIM-debug.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 14. Build Summary
      # --------------------------------------------------
      - name: Build Summary
        shell: bash
        run: |
          echo "======================================"
          echo " HILIM CHILIM APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "APK:"
          ls -lh "$APK_PATH"
          echo ""
          echo "Download the APK from the GitHub Actions Artifact."
