name: HILIM CHILIM - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Java 17 - required by modern Android Gradle Plugin
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle directly
      #    No gradlew file is required.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install required Android SDK components
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 6. Create missing debug keystore
      #    Your app/build.gradle.kts explicitly expects this file.
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          ls -lh debug.keystore

      # 7. Verify Android project
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src/main
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure OK."

      # 8. Clean previous build files
      - name: Clean project
        run: gradle clean --no-daemon

      # 9. Build Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 10. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully created."
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 11. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
