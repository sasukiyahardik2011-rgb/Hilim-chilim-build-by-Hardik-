name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Checking repository..."

          ZIP_FILE="zip.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo "Files in repository:"
            find . -maxdepth 4 -type f | head -300
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extraction completed."

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -300

      # --------------------------------------------------
      # 4. Find Android Gradle Project
      # --------------------------------------------------
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          # First check extracted root
          if [ -f "extracted/settings.gradle" ] || \
             [ -f "extracted/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted"
          fi

          # Search nested directories
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r settings_file; do

              candidate=$(dirname "$settings_file")

              if [ -f "$candidate/build.gradle" ] || \
                 [ -f "$candidate/build.gradle.kts" ]; then

                PROJECT_DIR="$candidate"
                break

              fi

            done < <(
              find extracted \
                -type f \
                -name "settings.gradle" -o -name "settings.gradle.kts" \
                -not -path "*/.gradle/*" \
                -print
            )
          fi

          # Fallback: search for build.gradle
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r build_file; do

              candidate=$(dirname "$build_file")

              if [ -f "$candidate/settings.gradle" ] || \
                 [ -f "$candidate/settings.gradle.kts" ]; then

                PROJECT_DIR="$candidate"
                break

              fi

            done < <(
              find extracted \
                -type f \
