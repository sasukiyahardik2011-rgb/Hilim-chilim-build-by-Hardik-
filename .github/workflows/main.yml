name: HILIM CHILIM - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 4. Install Android SDK components
      # --------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # --------------------------------------------------
      # 5. Extract ZIP files if repository contains ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Checking repository for ZIP files..."

          mkdir -p extracted

          ZIP_FOUND=false

          while IFS= read -r -d '' ZIP_FILE; do
            ZIP_FOUND=true

            echo "Extracting: $ZIP_FILE"

            ZIP_NAME=$(basename "$ZIP_FILE" .zip)

            mkdir -p "extracted/$ZIP_NAME"

            unzip -o "$ZIP_FILE" -d "extracted/$ZIP_NAME"

          done < <(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            -not -path "*/extracted/*" \
            -print0)

          if [ "$ZIP_FOUND" = false ]; then
            echo "No ZIP file found."
            echo "Using repository files directly."
          else
            echo "ZIP extraction completed."
          fi

      # --------------------------------------------------
      # 6. Find Android Gradle project
      # --------------------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          # First priority:
          # repository root
          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ] || \
             [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then

            PROJECT_DIR="$GITHUB_WORKSPACE"

          else

            # Search extracted/repository folders
            while IFS= read -r -d '' SETTINGS_FILE; do

              CANDIDATE_DIR=$(dirname "$SETTINGS_FILE")

              if [ -f "$CANDIDATE_DIR/build.gradle" ] || \
                 [ -f "$CANDIDATE_DIR/build.gradle.kts" ]; then

                PROJECT_DIR="$CANDIDATE_DIR"
                break

              fi

            done < <(find "$GITHUB_WORKSPACE" \
              -type f \
              -name "settings.gradle" -o -name "settings.gradle.kts" \
              -not -path "*/.git/*" \
              -not -path "*/.gradle/*" \
              -print0)

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Repository structure:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              -not -path "*/.git/*" \
              -print | head -300

            exit 1
          fi

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7. Verify Android project
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then

            echo "
