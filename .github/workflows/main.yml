name: HILIM CHILIM - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Find ZIP
      # --------------------------------------------------
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      # --------------------------------------------------
      # 4. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      # --------------------------------------------------
      # 5. Find Android Project
      # --------------------------------------------------
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            | head -n 1 || true)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \
              -name "build.gradle" -o -name "build.gradle.kts" \
              | head -n 1 || true)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project could not be found."
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      # --------------------------------------------------
      # 6. Check Project Structure
      # --------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo
          echo "Project files:"
          ls -la

          echo
          echo "Checking Android project..."

          if [ ! -d "app" ]; then
            echo "WARNING: app directory not found at root."
          else
            echo "app directory found."
          fi

          if [ -f "settings.gradle" ]; then
            echo "settings.gradle found."
          fi

          if [ -f "settings.gradle.kts" ]; then
            echo "settings.gradle.kts found."
          fi

          if [ -f "build.gradle" ]; then
            echo "build.gradle found."
          fi

          if [ -f "build.gradle.kts" ]; then
            echo "build.gradle.kts found."
          fi

          if [ -f "gradlew" ]; then
            echo "Gradle Wrapper found."
            chmod +x gradlew
          else
            echo "Gradle Wrapper not found."
            echo "Workflow will install Gradle directly."
          fi

      # --------------------------------------------------
      # 7. Install Gradle 9.3.1
      # --------------------------------------------------
      - name: Setup Gradle 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle"

          mkdir -p "$GRADLE_DIR"

          if [ ! -d "$GRADLE_DIR/gradle-$GRADLE_VERSION" ]; then
            echo "Downloading Gradle $GRADLE_VERSION..."

            curl -L \
              --fail \
              --retry 5 \
              --retry-delay 3 \
              -o "$GRADLE_DIR/gradle.zip" \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"

            unzip -q "$GRADLE_DIR/gradle.zip" -d "$GRADLE_DIR"

            rm -f "$GRADLE_DIR/gradle.zip"
          fi

          echo "$GRADLE_DIR/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

          "$GRADLE_DIR/gradle-$GRADLE_VERSION/bin/gradle" --version

      # --------------------------------------------------
      # 8. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Preparing Gradle..."

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Using existing Gradle Wrapper."
          else
            echo "No Gradle Wrapper found."
            echo "Using installed Gradle."
          fi

          gradle --version

      # --------------------------------------------------
      # 9. Check Google Services
      # --------------------------------------------------
      - name: Check Google Services
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Google Services..."

          if find . -type f -name "google-services.json" | grep -q .; then
            echo "google-services.json found."
          else
            echo "google-services.json not found."
            echo "Continuing because it may not be required."
          fi

      # --------------------------------------------------
      # 10. Clean Project
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Cleaning project..."

          if [ -f "gradlew" ]; then
            ./gradlew clean --no-daemon --stacktrace
          else
            gradle clean --no-daemon --stacktrace
          fi

      # --------------------------------------------------
      # 11. Build APK
      # --------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building APK..."

          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all
          fi

      # --------------------------------------------------
      # 12. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -E "debug|release" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then
            echo "APK not found."
            echo
            echo "All APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          echo "APK found:"
          echo "$APK_FILE"

      # --------------------------------------------------
      # 13. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK_FILE" ]; then
            echo "APK verification failed."
            exit 1
          fi

          echo "APK verification successful."

          ls -lh "$APK_FILE"

          file "$APK_FILE"

      # --------------------------------------------------
      # 14. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      # --------------------------------------------------
      # 15. Build Summary
      # --------------------------------------------------
      - name: Build Summary
        shell: bash
