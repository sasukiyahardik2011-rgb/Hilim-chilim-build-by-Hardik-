Name: HILIM CHILIM - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Find ZIP File
      - name: Find ZIP file
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in repository."
            exit 1
          fi
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "Found ZIP: $ZIP_FILE"

      # 5. Extract ZIP
      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.find_zip.outputs.zip_path }}" -d extracted

      # 6. Find Android Project Directory
      - name: Find Android Project
        id: find_project
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            else
              echo "Error: Android project structure not found."
              exit 1
            fi
          fi
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Project directory: $PROJECT_DIR"

      # 7. Make gradlew Executable (If present)
      - name: Grant Execute Permission for Gradlew
        run: |
          CD_DIR="${{ steps.find_project.outputs.project_dir }}"
          if [ -f "$CD_DIR/gradlew" ]; then
            chmod +x "$CD_DIR/gradlew"
          fi

      # 8. Generate Default Debug Keystore
      - name: Generate Debug Keystore
        run: |
          CD_DIR="${{ steps.find_project.outputs.project_dir }}"
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # બિલ્ડમાં જો ચોક્કસ 'debug.keystore' પ્રોજેક્ટ રૂટમાં શોધતું હોય તો ત્યાં પણ કોપી કરો
          cp ~/.android/debug.keystore "$CD_DIR/debug.keystore"

      # 9. Build APK
      - name: Build Debug APK
        run: |
          cd "${{ steps.find_project.outputs.project_dir }}"
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      # 10. Locate Generated APK
      - name: Locate APK
        id: locate_apk
        run: |
          PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"
          APK_PATH=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file was not created."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK generated at: $APK_PATH"

      # 11. Upload Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
