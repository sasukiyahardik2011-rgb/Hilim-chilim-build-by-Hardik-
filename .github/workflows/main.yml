name: HILIM CHILIM - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Find ZIP File
      - name: Find ZIP file
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in repository."
            exit 1
          fi
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT

      # 5. Extract ZIP
      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.find_zip.outputs.zip_path }}" -d extracted

      # 6. Find Android Project Directory
      - name: Find Android Project
        id: find_project
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            else
              echo "Error: Android project structure not found."
              exit 1
            fi
          fi
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      # 7. Dynamic Package Detection & Keystore Setup
      - name: Generate Keystore & Auto Google Services
        run: |
          CD_DIR="${{ steps.find_project.outputs.project_dir }}"
          APP_DIR="$CD_DIR/app"

          # 1. Generate Debug Keystore
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore "$CD_DIR/debug.keystore"

          # 2. Extract Real Package Name from Project
          PKG_NAME=""
          if [ -f "$APP_DIR/build.gradle" ]; then
            PKG_NAME=$(grep -oP 'applicationId\s+["\']\K[^"\']+' "$APP_DIR/build.gradle" || true)
          fi
          if [ -z "$PKG_NAME" ] && [ -f "$APP_DIR/build.gradle.kts" ]; then
            PKG_NAME=$(grep -oP 'applicationId\s*=\s*["\']\K[^"\']+' "$APP_DIR/build.gradle.kts" || true)
          fi
          if [ -z "$PKG_NAME" ] && [ -f "$APP_DIR/src/main/AndroidManifest.xml" ]; then
            PKG_NAME=$(grep -oP 'package=\s*["\']\K[^"\']+' "$APP_DIR/src/main/AndroidManifest.xml" || true)
          fi

          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.example.app"
          fi

          echo "Detected Package Name: $PKG_NAME"

          # 3. Create Valid google-services.json matching the actual Package Name
          mkdir -p "$APP_DIR"
          cat <<EOF > "$APP_DIR/google-services.json"
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_api_key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # 8. Build Debug APK
      - name: Build Debug APK
        run: |
          cd "${{ steps.find_project.outputs.project_dir }}"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon
          else
            gradle assembleDebug -Djava.awt.headless=true --no-daemon
          fi

      # 9. Locate Generated APK
      - name: Locate APK
        id: locate_apk
        run: |
          PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"
          APK_PATH=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file was not created."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      # 10. Upload Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
