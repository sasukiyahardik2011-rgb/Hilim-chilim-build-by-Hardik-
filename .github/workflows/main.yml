name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # --------------------------------------------------
      # 3. Check Java
      # --------------------------------------------------
      - name: Verify Java 17
        shell: bash
        run: |
          set -e
          echo "Java version:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # --------------------------------------------------
      # 4. Install Gradle 9.3.1
      # --------------------------------------------------
      - name: Setup Gradle 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.3.1"

          echo "Downloading Gradle ${GRADLE_VERSION}..."

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O /tmp/gradle.zip

          sudo mkdir -p /opt/gradle

          sudo unzip -q /tmp/gradle.zip -d /opt/gradle

          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          export PATH="/opt/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"

          echo ""
          echo "Gradle version:"
          gradle --version


      # --------------------------------------------------
      # 5. Find ZIP file
      # --------------------------------------------------
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 6. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -300


      # --------------------------------------------------
      # 7. Find Android Project
      # --------------------------------------------------
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # First preference: settings.gradle / settings.gradle.kts
          SETTINGS_FILE=$(find extracted -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

