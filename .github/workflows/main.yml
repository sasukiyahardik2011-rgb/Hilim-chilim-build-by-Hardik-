name: HILIM CHILIM - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extracted successfully."

      - name: Find Android Project
        id: find_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify project structure
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle.kts/settings.gradle not found."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && \
             [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle.kts/build.gradle not found."
            exit 1
          fi

          echo ""
          echo "Android Gradle project structure verified."

      - name: Check Google Services
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Checking Google Services..."

          if find . -type f -name "google-services.json" | grep -q .; then
            echo "google-services.json found."
          else
            echo "google-services.json not found."
            echo "Continuing..."
          fi

      - name: Clean project
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: find_apk
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching build files:"
            find . -type f | grep -E "\.(apk|aab)$" || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="${{ steps.find_apk.outputs.apk_path }}"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK verification failed."
            exit 1
          fi

          echo "APK verified successfully."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ steps.find_project.outputs.project_dir }}/${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "======================================"
          echo " HILIM CHILIM APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK artifact: HILIM-CHILIM-APK"
