name: HILIM CHILIM - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # 4. Android SDK packages
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"


      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # 6. Extract ZIP if repository contains ZIP
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found:"
            echo "$ZIP_FILE"

            unzip -o "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/extracted"

            echo "ZIP extracted successfully."
          else
            echo "No ZIP found."
          fi


      # 7. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          # Check repository root
          if [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi


          # Check extracted folder
          if [ -z "$PROJECT_DIR" ]; then

            if [ -f "$GITHUB_WORKSPACE/extracted/settings.gradle.kts" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/extracted"
            elif [ -f "$GITHUB_WORKSPACE/extracted/settings.gradle" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/extracted"
            fi

          fi


          # Search all folders safely
          if [ -z "$PROJECT_DIR" ]; then

            FOUND=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name "settings.gradle.kts" \
              -print -quit)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi

          fi


          # Search settings.gradle
          if [ -z "$PROJECT_DIR" ]; then

            FOUND=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name "settings.gradle" \
              -print -quit)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi

          fi


          # Stop if project not found
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Android Gradle project not found."
            echo ""
            echo "Repository files:"
            
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              -print | head -300

            exit 1
          fi


          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # 8. Verify project
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          echo ""
          echo "Android project verification successful."


      # 9. Create debug keystore
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "debug.keystore" ]; then

            echo "Creating debug keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "debug.keystore already exists."

          fi

          ls -lh debug.keystore


      # 10. Generate Gradle wrapper if missing
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then

            echo "gradlew already exists."

            chmod +x gradlew

          else

            echo "gradlew not found."
            echo "Generating Gradle wrapper..."

            gradle wrapper \
              --gradle-version 8.11.1

            chmod +x gradlew

            echo "Gradle wrapper generated successfully."

          fi


      # 11. Clean
      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # 12. Build APK
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building HILIM CHILIM APK..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # 13. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      # 14. Rename APK
      - name: Prepare Release APK
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/HILIM-CHILIM.apk"

          ls -lh "$GITHUB_WORKSPACE/release/HILIM-CHILIM.apk"


      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: release/HILIM-CHILIM.apk
          if-no-files-found: error
